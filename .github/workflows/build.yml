name: DaProdGiochi · verifica e installer
on:
  push:
    branches: [main, daprodgiochi-2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --features desktop --locked -- -D warnings
      - run: cargo build --locked
      - run: node tests/browser.mjs
      - name: Installer Windows
        working-directory: apps/desktop
        run: npx tauri build --features desktop
      - uses: actions/upload-artifact@v4
        with:
          name: DaProdGiochi-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: apps/mobile
      - name: Test e APK con firma compatibile
        working-directory: apps/mobile
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Nome del pacchetto
        run: cp apps/mobile/app/build/outputs/apk/release/app-release.apk DaProdGiochi-telefono-2.0.0.apk
      - name: Verifica continuità con l'APK reale 1.7.10
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/cammo22/DaProdGiochi/releases/download/v1.7.10/DaProdSuite-telefono-1.7.10.apk --output "$RUNNER_TEMP/suite-1.7.10.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          python tests/android_upgrade.py "$signer" "$aapt" "$RUNNER_TEMP/suite-1.7.10.apk" DaProdGiochi-telefono-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DaProdGiochi-Android
          path: DaProdGiochi-telefono-2.0.0.apk
          if-no-files-found: error
