name: Release

# Si pubblica taggando: `git tag v1.2.3 && git push --tags`.
# La CI compila su Windows e allega alla Release l'installer e il file latest.yml
# che electron-updater legge per capire se c'è una versione nuova.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # Prima di controllare i tipi bisogna compilare i pacchetti del workspace:
      # @daprod/ipc e @daprod/runtime si vedono da fuori attraverso il loro
      # `dist/index.d.ts`, che su una copia appena clonata non esiste ancora.
      # Al contrario, `tsc` dello shell non trova nemmeno i moduli e la release
      # muore prima di cominciare — che è esattamente quello che è successo al
      # primo tag mai pubblicato.
      - name: Compila i pacchetti
        run: pnpm run build

      - name: Controllo dei tipi
        run: pnpm run typecheck

      # L'accesso remoto è l'unico pezzo che si può sbagliare in silenzio: un
      # controllo che non scatta non rompe niente, apre. Queste due prove
      # accendono un gateway vero e un server MCP vero, senza Electron e senza
      # scheda video, e girano in una decina di secondi.
      - name: Prova il gateway e l'MCP
        run: pnpm run prova

      - name: Crea l'installer
        run: pnpm run dist

      # Il caricamento lo facciamo noi, un file alla volta e alla fine.
      # electron-builder sa pubblicare da solo quando vede un tag, ma crea la
      # Release *mentre* sta caricando: al primo tag vero i 95 MB dell'installer
      # sono rimasti per strada e nella Release c'era solo la blockmap da 100 KB.
      # `latest.yml` va caricato comunque: è il file che electron-updater legge
      # per accorgersi che esiste una versione nuova.
      - name: Pubblica la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Cosa cambia per chi la usa: CHANGELOG.md"
          }
          $file = Get-ChildItem installer/*.exe, installer/latest.yml, installer/*.blockmap |
            Select-Object -ExpandProperty FullName
          gh release upload $tag $file --clobber

      - name: Controlla che ci sia davvero tutto
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nomi = gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
          if (-not ($nomi -match '\.exe$') -or -not ($nomi -match 'latest\.yml')) {
            throw "Nella Release mancano l'installer o latest.yml: $nomi"
          }
          Write-Host "Nella Release ci sono: $nomi"
          # Una Release in bozza non la vede nessuno e l'aggiornamento automatico
          # non la trova: alla 0.1.0 è successo e si è dovuta pubblicare a mano.
          gh release edit "${{ github.ref_name }}" --draft=false

  # L'app del telefono. Un job a sé, su Linux, perché non ha niente a che vedere
  # con l'installer di Windows e non deve poter far fallire quello: se un giorno
  # Gradle si rompe, la suite esce lo stesso e manca solo l'APK.
  android:
    # Dopo il job di Windows, non insieme: è quello che **crea** la Release, e
    # caricarci dentro un file prima che esista non funziona.
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compila l'APK
        working-directory: apps/mobile
        run: ./gradlew assembleRelease --no-daemon

      # Il nome che vede chi scarica. `app-release.apk` non dice né cos'è né di
      # che versione.
      - name: Dagli il nome giusto
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp apps/mobile/app/build/outputs/apk/release/app-release.apk "DaProdSuite-telefono-$v.apk"

      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" DaProdSuite-telefono-*.apk --clobber
