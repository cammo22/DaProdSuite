<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DaProd">
  <!--
    Il marchio DaProd: una D che, se la guardi un attimo di troppo, ti guarda
    indietro. Il vuoto dentro la lettera non e' vuoto — e' una pupilla, e le
    corde che le girano intorno non si chiudono e non si allineano a niente.
    Regge anche piccolissima, perche' la sagoma della D resta leggibile a 24
    pixel: la stranezza sta dentro, non nel contorno.
  -->
  <defs>
    <linearGradient id="lettera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#c05cff"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="fondo" cx="46%" cy="40%" r="72%">
      <stop offset="0" stop-color="#161227"/>
      <stop offset="62%" stop-color="#0a0b12"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="iride" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffa63d" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c05cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c05cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="quadro">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#quadro)">
    <rect x="0" y="0" width="512" height="512" fill="url(#fondo)"/>

    <!-- Le corde: girano attorno alla lettera senza chiudersi, e nessuna e'
         d'accordo con le altre su dove sia il centro. -->
    <g fill="none" stroke-linecap="round" opacity="0.5">
      <path d="M92,150 C 40,262 96,404 232,448" stroke="#3ddbff" stroke-width="5" opacity="0.55"/>
      <path d="M430,96 C 486,190 470,318 388,398" stroke="#5cff9d" stroke-width="4" opacity="0.45"/>
      <path d="M156,66 C 268,34 372,58 436,140" stroke="#ff5c8a" stroke-width="4" opacity="0.4"/>
      <path d="M64,352 C 132,336 156,300 148,246" stroke="#c05cff" stroke-width="6" opacity="0.5"/>
    </g>

    <!-- Il chiarore dietro l'occhio: si accorge di te prima che tu di lui. -->
    <circle cx="268" cy="256" r="104" fill="url(#iride)"/>

    <!-- La D. -->
    <path d="M168,392 L168,120 C 306,120 384,180 384,256 C 384,332 306,392 168,392"
          fill="none" stroke="url(#lettera)" stroke-width="44"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- La pupilla, dentro il vuoto della lettera: verticale, come quella di
         una capra o di qualcosa che non e' una capra. -->
    <ellipse cx="268" cy="256" rx="16" ry="62" fill="#04050a"/>
    <ellipse cx="268" cy="256" rx="16" ry="62" fill="none" stroke="#ffa63d" stroke-width="2" opacity="0.5"/>
    <ellipse cx="262" cy="222" rx="5" ry="12" fill="#ffd9a3" opacity="0.5"/>
  </g>
</svg>
