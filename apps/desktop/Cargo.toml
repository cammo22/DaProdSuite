[package]
name = "daprodgiochi"
version = "2.0.0"
edition = "2024"
description = "La sala giochi privata DaProd"
license = "MIT"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
include_dir = "0.7"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
directories = "6"
tauri = { version = "2", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
