<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeapTalk Web</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <main class="shell">
      <section class="stage-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow">LeapTalk Live</div>
          </div>
          <div class="connection" id="connectionState">
            <span class="dot"></span>
            <span>Disconnected</span>
          </div>
        </header>

        <div class="video-shell">
          <video id="avatarVideo" class="avatar-video" playsinline></video>
          <img id="avatarImage" class="avatar-image" alt="Avatar preview" />
          <div class="video-placeholder" id="videoPlaceholder">
            <span>Waiting for live talking video</span>
          </div>
          <div class="hud">
            <div>
              <span class="hud-label">FPS</span>
              <strong id="fpsValue">--</strong>
            </div>
            <div>
              <span class="hud-label">Latency</span>
              <strong id="latencyValue">--</strong>
            </div>
            <div>
              <span class="hud-label">Mode</span>
              <strong id="modeValue">Lite</strong>
            </div>
          </div>
        </div>

        <div class="controls-row">
          <label class="file-button">
            <input id="avatarInput" type="file" accept="image/*" />
            <span>Load Image</span>
          </label>
          <button id="connectButton" class="pi-button primary">Connect</button>
          <button id="recordButton" class="pi-button" disabled>Hold to Talk</button>
          <select id="qualitySelect" class="pi-button" title="Risoluzione del video generato"></select>
          <div class="wave" id="voiceWave">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>

        <div class="status-line" id="statusLine">Configure .env, start the server, then connect to begin.</div>
      </section>

      <aside class="chat-panel">
        <header class="chat-header">
          <div>
            <div class="eyebrow">Conversation</div>
            <h2>Chat History</h2>
          </div>
          <button id="clearButton" class="icon-button" title="Clear conversation">×</button>
        </header>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="input-bar">
          <textarea id="textInput" rows="2" placeholder="Type a message, or hold the record button to speak"></textarea>
          <button id="sendButton" class="pi-button primary" type="submit" disabled>Send</button>
        </form>
      </aside>
    </main>

    <script>
      const state = {
        ws: null,
        connected: false,
        recording: false,
        mediaRecorder: null,
        stream: null,
        audioContext: null,
        micSource: null,
        micProcessor: null,
        avatarUrl: '/assets/photo.jpg',
        assistantDraftId: null,
        videoObjectUrl: null,
        videoQueue: [],
        videoPlaying: false,
        mediaSource: null,
        sourceBuffer: null,
        mediaSourceUrl: null,
        pendingSegments: [],
        mseNextTimestamp: 0,
        mseReady: false,
        mseEnded: false,
        mseFailed: false,
        recorderStopping: false,
        videoRevealToken: 0,
        dialogueHoldActive: false,
        pendingDialogueEvents: [],
        appendStats: null,
        prerollFloor: 1.5,
      }

      const els = {
        connectionState: document.getElementById('connectionState'),
        avatarVideo: document.getElementById('avatarVideo'),
        avatarImage: document.getElementById('avatarImage'),
        videoPlaceholder: document.getElementById('videoPlaceholder'),
        fpsValue: document.getElementById('fpsValue'),
        latencyValue: document.getElementById('latencyValue'),
        modeValue: document.getElementById('modeValue'),
        avatarInput: document.getElementById('avatarInput'),
        connectButton: document.getElementById('connectButton'),
        recordButton: document.getElementById('recordButton'),
        voiceWave: document.getElementById('voiceWave'),
        statusLine: document.getElementById('statusLine'),
        messages: document.getElementById('messages'),
        clearButton: document.getElementById('clearButton'),
        chatForm: document.getElementById('chatForm'),
        textInput: document.getElementById('textInput'),
        sendButton: document.getElementById('sendButton'),
        qualitySelect: document.getElementById('qualitySelect'),
      }

      // La qualita' viaggia con ogni messaggio: il server la applica al turno
      // successivo senza ricaricare il modello, quindi si puo' cambiare al volo.
      function currentQuality() {
        return els.qualitySelect.value || state.defaultQuality || '384p'
      }

      function setConnected(connected) {
        state.connected = connected
        els.connectionState.classList.toggle('online', connected)
        els.connectionState.querySelector('span:last-child').textContent = connected ? 'Connected' : 'Disconnected'
        els.connectButton.textContent = connected ? 'Disconnect' : 'Connect'
        els.sendButton.disabled = !connected
        els.recordButton.disabled = !connected
      }

      function setStatus(text) {
        els.statusLine.textContent = text || ''
      }

      function scrollMessages() {
        els.messages.scrollTop = els.messages.scrollHeight
      }

      function addMessage(role, text, extraClass = '') {
        const node = document.createElement('div')
        node.className = `message ${role} ${extraClass}`.trim()
        const content = document.createElement('div')
        content.className = 'message-content'
        content.textContent = text
        node.appendChild(content)
        els.messages.appendChild(node)
        scrollMessages()
        return content
      }

      function startAssistantDraft() {
        const id = crypto.randomUUID()
        const content = addMessage('assistant', '')
        state.assistantDraftId = id
        content.dataset.draftId = id
        return content
      }

      function getAssistantDraft() {
        if (!state.assistantDraftId) return startAssistantDraft()
        const node = els.messages.querySelector(`[data-draft-id="${state.assistantDraftId}"]`)
        return node || startAssistantDraft()
      }

      function finishAssistantDraft(text) {
        const node = getAssistantDraft()
        if (text) node.textContent = text
        delete node.dataset.draftId
        state.assistantDraftId = null
        scrollMessages()
      }

      function holdCurrentVisual() {
        const video = els.avatarVideo
        if (
          video.style.display !== 'none' &&
          video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
          video.videoWidth > 0 &&
          video.videoHeight > 0
        ) {
          try {
            const canvas = document.createElement('canvas')
            canvas.width = video.videoWidth
            canvas.height = video.videoHeight
            const ctx = canvas.getContext('2d')
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
            els.avatarImage.src = canvas.toDataURL('image/jpeg', 0.92)
            els.avatarImage.style.display = 'block'
            els.videoPlaceholder.style.display = 'none'
            return
          } catch (_) {}
        }

        if (!els.avatarImage.getAttribute('src')) {
          els.avatarImage.src = state.avatarUrl
        }
        els.avatarImage.style.display = 'block'
        els.videoPlaceholder.style.display = 'none'
      }

      function resetVideoPlayback({ preserveFrame = true } = {}) {
        if (preserveFrame) holdCurrentVisual()
        state.videoRevealToken += 1
        state.videoQueue = []
        state.videoPlaying = false
        state.pendingSegments = []
        state.mseNextTimestamp = 0
        state.mseReady = false
        state.mseEnded = false
        state.mseFailed = false
        state.sourceBuffer = null
        // Ogni turno riparte con statistiche pulite: la velocita' di generazione
        // cambia con la qualita' scelta e con quanto e' occupata la GPU.
        state.appendStats = null
        state.prerollFloor = PREROLL_BASE
        if (state.mediaSource && state.mediaSource.readyState === 'open') {
          try {
            state.mediaSource.endOfStream()
          } catch (_) {}
        }
        state.mediaSource = null
        els.avatarVideo.onended = null
        els.avatarVideo.pause()
        els.avatarVideo.removeAttribute('src')
        els.avatarVideo.load()
        if (state.videoObjectUrl) {
          URL.revokeObjectURL(state.videoObjectUrl)
          state.videoObjectUrl = null
        }
        if (state.mediaSourceUrl) {
          URL.revokeObjectURL(state.mediaSourceUrl)
          state.mediaSourceUrl = null
        }
      }

      async function fetchVideoObjectUrl(url) {
        const cacheBustedUrl = `${url}?t=${Date.now()}`
        const response = await fetch(cacheBustedUrl, { cache: 'no-store' })
        if (!response.ok) throw new Error(`Video loading failed: HTTP ${response.status}`)
        const blob = await response.blob()
        return URL.createObjectURL(blob)
      }

      function objectUrlFromVideoBytes(bytes) {
        const blob = new Blob([bytes], { type: 'video/mp4' })
        return URL.createObjectURL(blob)
      }

      async function decodeVideoChunkPacket(raw) {
        const buffer = raw instanceof ArrayBuffer ? raw : await raw.arrayBuffer()
        const view = new DataView(buffer)
        if (buffer.byteLength < 8) throw new Error('Video chunk packet is too short')
        const magic = String.fromCharCode(
          view.getUint8(0),
          view.getUint8(1),
          view.getUint8(2),
          view.getUint8(3),
        )
        if (magic !== 'LTF4' && magic !== 'LTMP') throw new Error('Unknown binary message')
        const metaLength = view.getUint32(4, false)
        const metaStart = 8
        const metaEnd = metaStart + metaLength
        if (metaEnd > buffer.byteLength) throw new Error('Incomplete video chunk metadata')
        const metaBytes = new Uint8Array(buffer, metaStart, metaLength)
        const meta = JSON.parse(new TextDecoder().decode(metaBytes))
        const videoBytes = buffer.slice(metaEnd)
        return { ...meta, transport: meta.transport || (magic === 'LTF4' ? 'websocket_fmp4' : 'websocket_mp4'), videoBytes }
      }

      function canUseMse(mimeType) {
        return Boolean(
          window.MediaSource &&
          typeof MediaSource.isTypeSupported === 'function' &&
          MediaSource.isTypeSupported(mimeType),
        )
      }

      function showVideo() {
        els.avatarVideo.style.display = 'block'
        els.avatarImage.style.display = 'none'
        els.videoPlaceholder.style.display = 'none'
      }

      function releaseDialogueEvents() {
        state.dialogueHoldActive = false
        const pending = state.pendingDialogueEvents.splice(0)
        for (const data of pending) {
          handleDialogueEvent(data)
        }
      }

      function handleDialogueEvent(data) {
        if (data.type === 'user_transcript') {
          addMessage('user', data.text)
        } else if (data.type === 'assistant_delta') {
          const draft = getAssistantDraft()
          draft.textContent += data.text || ''
          scrollMessages()
        } else if (data.type === 'assistant_final') {
          finishAssistantDraft(data.text || '')
        }
      }

      function queueOrHandleDialogueEvent(data) {
        if (state.dialogueHoldActive) {
          state.pendingDialogueEvents.push(data)
          return
        }
        handleDialogueEvent(data)
      }

      function revealVideoWhenFrameReady() {
        const video = els.avatarVideo
        const token = ++state.videoRevealToken
        video.style.display = 'block'
        els.videoPlaceholder.style.display = 'none'

        const reveal = () => {
          if (token !== state.videoRevealToken) return
          showVideo()
          releaseDialogueEvents()
        }

        if ('requestVideoFrameCallback' in video) {
          video.requestVideoFrameCallback(reveal)
          return
        }

        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          reveal()
          return
        }

        video.addEventListener('loadeddata', reveal, { once: true })
        video.addEventListener('playing', reveal, { once: true })
      }

      function ensureMse(mimeType) {
        if (state.sourceBuffer) return true
        if (!canUseMse(mimeType)) {
          state.mseFailed = true
          return false
        }

        const mediaSource = new MediaSource()
        state.mediaSource = mediaSource
        state.mediaSourceUrl = URL.createObjectURL(mediaSource)
        state.mseReady = false
        state.mseEnded = false
        els.avatarVideo.src = state.mediaSourceUrl
        els.avatarVideo.style.display = 'block'
        els.videoPlaceholder.style.display = 'none'

        mediaSource.addEventListener('sourceopen', () => {
          if (state.mediaSource !== mediaSource || state.sourceBuffer) return
          try {
            const sourceBuffer = mediaSource.addSourceBuffer(mimeType)
            sourceBuffer.mode = 'segments'
            sourceBuffer.addEventListener('updateend', appendPendingMseSegments)
            sourceBuffer.addEventListener('error', () => {
              state.mseFailed = true
              setStatus('MSE video buffering failed. Switched to compatibility playback.')
            })
            state.sourceBuffer = sourceBuffer
            state.mseReady = true
            appendPendingMseSegments()
          } catch (err) {
            state.mseFailed = true
            const msg = err instanceof Error ? err.message : String(err)
            addMessage('system', `MSE initialization failed: ${msg}`)
            setStatus('MSE initialization failed. Switched to compatibility playback.')
          }
        }, { once: true })
        return true
      }

      // Il video arriva a pezzi mentre viene generato. Se la generazione e' piu'
      // lenta della riproduzione il buffer si svuota comunque, per quanto si
      // aspetti: allora il margine richiesto viene calcolato sulla velocita'
      // misurata davvero, e cresce a ogni stallo invece di ripetere l'errore.
      const PREROLL_BASE = 1.5
      const PREROLL_MAX = 8

      function appendRate() {
        const stats = state.appendStats
        if (!stats || !stats.startedAt || stats.videoSeconds <= 0) return 0
        const elapsed = (performance.now() - stats.startedAt) / 1000
        if (elapsed < 0.5) return 0
        return stats.videoSeconds / elapsed
      }

      function requiredPreroll() {
        let need = state.prerollFloor || PREROLL_BASE
        const rate = appendRate()
        if (rate > 0 && rate < 1) need = Math.max(need, PREROLL_BASE / rate)
        return Math.min(need, PREROLL_MAX)
      }

      function bufferedAhead() {
        const video = els.avatarVideo
        const buffered = video.buffered
        if (!buffered || !buffered.length) return 0
        const position = video.currentTime
        for (let i = 0; i < buffered.length; i += 1) {
          if (position >= buffered.start(i) - 0.05 && position <= buffered.end(i)) {
            return buffered.end(i) - position
          }
        }
        return buffered.end(buffered.length - 1) - position
      }

      function maybeStartPlayback() {
        const video = els.avatarVideo
        if (!video.paused) return
        // Si parte quando c'e' abbastanza margine, oppure quando non arrivera'
        // piu' nulla (fine turno): in quel caso aspettare sarebbe inutile.
        if (!state.mseEnded && bufferedAhead() < requiredPreroll()) return
        video.play().catch(() => {
          setStatus('Autoplay was blocked. Click the video to continue.')
        })
      }

      // Se il buffer si svuota comunque, il browser emette "waiting". Invece di
      // singhiozzare fotogramma per fotogramma si alza l'asticella e si aspetta
      // di aver ricostruito un margine piu' ampio prima di ripartire.
      els.avatarVideo.addEventListener('waiting', () => {
        if (!state.mediaSource || state.mseEnded) return
        state.prerollFloor = Math.min((state.prerollFloor || PREROLL_BASE) + 1, PREROLL_MAX)
        maybeStartPlayback()
      })

      // In un flusso che non finisce mai i piccoli scarti fra l'orologio di
      // riproduzione e i tempi dei segmenti si sommano, finche' la testina esce
      // dai dati disponibili e il video resta fermo per sempre. Questo controllo
      // la riporta sul bordo del flusso: e' la rete di sicurezza che rende
      // impossibile il blocco definitivo.
      const RESYNC_BEHIND = 6
      const RESYNC_TARGET = 1.5

      function liveResync() {
        const video = els.avatarVideo
        const buffered = video.buffered
        if (!state.mediaSource || state.mseEnded || !buffered || !buffered.length) return
        const end = buffered.end(buffered.length - 1)
        const start = buffered.start(0)
        const position = video.currentTime

        if (position > end || position < start) {
          // Fuori dai dati: si rientra sul bordo.
          video.currentTime = Math.max(start, end - RESYNC_TARGET)
        } else if (end - position > RESYNC_BEHIND) {
          // Troppo indietro (di solito dopo una serie di stalli): si salta avanti
          // invece di trascinarsi dietro un ritardo che non recupera piu'.
          video.currentTime = end - RESYNC_TARGET
        }
        maybeStartPlayback()
      }

      setInterval(liveResync, 1000)

      const KEEP_PAST_SECONDS = 30

      function evictOldBuffer(sourceBuffer) {
        const video = els.avatarVideo
        const buffered = sourceBuffer.buffered
        if (!buffered || !buffered.length) return false
        const cutoff = video.currentTime - KEEP_PAST_SECONDS
        if (cutoff <= buffered.start(0) + 1) return false
        try {
          sourceBuffer.remove(buffered.start(0), cutoff)
          return true // l'append riprende da solo su updateend
        } catch (_) {
          return false
        }
      }

      function appendPendingMseSegments() {
        const mediaSource = state.mediaSource
        const sourceBuffer = state.sourceBuffer
        if (!mediaSource || !sourceBuffer || mediaSource.readyState !== 'open' || sourceBuffer.updating) return
        // Flusso continuo: senza sfoltire, il buffer del browser cresce all'infinito
        // e prima o poi appendBuffer fallisce per quota superata. Si tiene una
        // finestra di passato e si butta il resto.
        if (evictOldBuffer(sourceBuffer)) return

        const segment = state.pendingSegments.shift()
        if (!segment) {
          if (state.mseEnded) {
            try {
              mediaSource.endOfStream()
            } catch (_) {}
          }
          // Coda vuota: e' l'ultima occasione per far partire il video, altrimenti
          // resterebbe in pausa per sempre se il margine e' stato raggiunto proprio ora.
          maybeStartPlayback()
          return
        }
        try {
          sourceBuffer.timestampOffset = segment.timestampOffset
          sourceBuffer.appendBuffer(segment.bytes)
          maybeStartPlayback()
          revealVideoWhenFrameReady()
        } catch (err) {
          state.mseFailed = true
          const msg = err instanceof Error ? err.message : String(err)
          addMessage('system', `MSE append failed: ${msg}`)
          setStatus('MSE append failed. Switched to compatibility playback.')
        }
      }

      function enqueueMseSegment(data) {
        const mimeType = data.mime_type || 'video/mp4; codecs="avc1.64001e, mp4a.40.2"'
        if (state.mseFailed || !data.videoBytes || !ensureMse(mimeType)) return false
        const duration = Number(data.frames || 0) / Number(data.fps || 25)
        // Traccia quanto video reale arriva per secondo reale: e' la velocita'
        // di generazione, e decide quanto margine serve prima di partire.
        if (!state.appendStats) state.appendStats = { startedAt: performance.now(), videoSeconds: 0 }
        state.appendStats.videoSeconds += duration
        state.pendingSegments.push({
          bytes: data.videoBytes,
          timestampOffset: state.mseNextTimestamp,
        })
        state.mseNextTimestamp += duration
        appendPendingMseSegments()
        return true
      }

      function finishMseStream() {
        state.mseEnded = true
        appendPendingMseSegments()
      }

      async function playNextVideoChunk() {
        if (state.videoPlaying) return
        const item = state.videoQueue.shift()
        if (!item) return
        state.videoPlaying = true
        if (state.videoObjectUrl) {
          URL.revokeObjectURL(state.videoObjectUrl)
          state.videoObjectUrl = null
        }
        holdCurrentVisual()
        try {
          state.videoObjectUrl = item.videoBytes
            ? objectUrlFromVideoBytes(item.videoBytes)
            : await fetchVideoObjectUrl(item.url)
          els.avatarVideo.src = state.videoObjectUrl
        } catch (err) {
          state.videoPlaying = false
          const msg = err instanceof Error ? err.message : String(err)
          addMessage('system', msg)
          setStatus(msg)
          playNextVideoChunk()
          return
        }
        els.avatarVideo.style.display = 'block'
        els.videoPlaceholder.style.display = 'none'
        els.avatarVideo.onended = () => {
          state.videoPlaying = false
          playNextVideoChunk()
        }
        await els.avatarVideo.play().catch(() => {
          setStatus('Autoplay was blocked. Click the video to continue.')
        })
        revealVideoWhenFrameReady()
      }

      function enqueueVideoChunk(data) {
        if (data.transport === 'websocket_fmp4' && enqueueMseSegment(data)) return
        state.videoQueue.push(data)
        playNextVideoChunk()
      }

      function connect() {
        if (state.ws) {
          state.ws.close()
          return
        }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws'
        const ws = new WebSocket(`${proto}://${location.host}/ws/chat`)
        state.ws = ws
        ws.binaryType = 'arraybuffer'
        ws.onopen = () => {
          setConnected(true)
          ws.send(JSON.stringify({ type: 'init', avatar_url: state.avatarUrl, quality: currentQuality() }))
          setStatus('Connected. Ready to start the conversation.')
        }
        ws.onclose = () => {
          state.ws = null
          setConnected(false)
          setStatus('Disconnected.')
        }
        ws.onerror = () => setStatus('WebSocket connection error.')
        ws.onmessage = async (event) => {
          if (typeof event.data !== 'string') {
            try {
              const chunk = await decodeVideoChunkPacket(event.data)
              enqueueVideoChunk(chunk)
              if (chunk.generation_fps) els.fpsValue.textContent = Number(chunk.generation_fps).toFixed(1)
              // In flusso continuo il tempo trascorso cresce all'infinito e non
              // dice nulla: quello che conta e' il margine davanti alla testina.
              // Lo stato non va riscritto a ogni chunk, altrimenti cancella di
              // continuo i messaggi utili.
              els.latencyValue.textContent = `${bufferedAhead().toFixed(1)}s buf`
            } catch (err) {
              const msg = err instanceof Error ? err.message : String(err)
              addMessage('system', msg)
              setStatus(msg)
            }
            return
          }
          const data = JSON.parse(event.data)
          if (data.type === 'ready') {
            setStatus(data.message)
          } else if (data.type === 'status') {
            setStatus(data.message)
          } else if (data.type === 'user_transcript') {
            queueOrHandleDialogueEvent(data)
          } else if (data.type === 'assistant_delta') {
            queueOrHandleDialogueEvent(data)
          } else if (data.type === 'assistant_final') {
            queueOrHandleDialogueEvent(data)
          } else if (data.type === 'video_generating') {
            els.voiceWave.classList.remove('active')
            setStatus(data.message)
          } else if (data.type === 'video_stream_start') {
            // Il flusso e' continuo: parte una volta sola, non a ogni turno.
            resetVideoPlayback()
            // Niente piu' attesa del primo fotogramma prima di mostrare il testo:
            // la chat scorre in tempo reale mentre il modello scrive.
            state.dialogueHoldActive = false
            state.pendingDialogueEvents = []
            els.voiceWave.classList.remove('active')
            setStatus(data.message)
          } else if (data.type === 'quality_warning') {
            // Avviso, non imposizione: la qualita' scelta resta quella.
            addMessage('system', data.message)
            setStatus(data.message)
          } else if (data.type === 'avatar_state') {
            const speaking = data.state === 'speaking'
            els.voiceWave.classList.toggle('active', speaking)
            setStatus(speaking ? 'L\'avatar sta parlando.' : 'In attesa: l\'avatar resta in movimento.')
          } else if (data.type === 'video_stream_ready') {
            setStatus(`Video stream ready: ${data.frames_per_chunk} frames/chunk`)
          } else if (data.type === 'fps_update') {
            els.fpsValue.textContent = Number(data.fps).toFixed(1)
          } else if (data.type === 'video_chunk') {
            enqueueVideoChunk(data)
            if (data.generation_fps) els.fpsValue.textContent = Number(data.generation_fps).toFixed(1)
            // In flusso continuo il tempo trascorso cresce all'infinito e non dice
            // nulla: quello che conta e' quanto video c'e' pronto davanti alla testina.
            els.latencyValue.textContent = `${bufferedAhead().toFixed(1)}s buf`
          } else if (data.type === 'video_chunk_ready') {
            if (data.generation_fps) els.fpsValue.textContent = Number(data.generation_fps).toFixed(1)
          } else if (data.type === 'video_stream_end') {
            finishMseStream()
            releaseDialogueEvents()
            setStatus(`Video stream complete: ${data.chunks} chunks`)
          } else if (data.type === 'turn_complete') {
            releaseDialogueEvents()
            setStatus('Ready.')
          } else if (data.type === 'error') {
            releaseDialogueEvents()
            addMessage('system', data.message || 'An error occurred')
            setStatus(data.message || 'An error occurred')
          }
        }
      }

      async function uploadAvatar(file) {
        const form = new FormData()
        form.append('file', file)
        const res = await fetch('/api/avatar', { method: 'POST', body: form })
        if (!res.ok) throw new Error(await res.text())
        const data = await res.json()
        state.avatarUrl = data.url
        els.avatarImage.src = data.url
        els.avatarImage.style.display = 'block'
        els.avatarVideo.style.display = 'none'
        els.videoPlaceholder.style.display = 'none'
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
          state.ws.send(JSON.stringify({ type: 'init', avatar_url: state.avatarUrl, quality: currentQuality() }))
        }
      }

      function floatToPcm16(samples) {
        const output = new Int16Array(samples.length)
        for (let i = 0; i < samples.length; i++) {
          const value = Math.max(-1, Math.min(1, samples[i]))
          output[i] = value < 0 ? value * 32768 : value * 32767
        }
        return output
      }

      function downsampleTo16k(input, sourceRate) {
        const targetRate = 16000
        if (sourceRate === targetRate) return input
        const ratio = sourceRate / targetRate
        const outputLength = Math.max(1, Math.floor(input.length / ratio))
        const output = new Float32Array(outputLength)
        for (let i = 0; i < outputLength; i++) {
          const start = Math.floor(i * ratio)
          const end = Math.min(input.length, Math.floor((i + 1) * ratio))
          let sum = 0
          let count = 0
          for (let j = start; j < end; j++) {
            sum += input[j]
            count += 1
          }
          output[i] = count ? sum / count : input[Math.min(start, input.length - 1)]
        }
        return output
      }

      function cleanupMicPipeline() {
        if (state.micProcessor) {
          state.micProcessor.disconnect()
          state.micProcessor.onaudioprocess = null
          state.micProcessor = null
        }
        if (state.micSource) {
          state.micSource.disconnect()
          state.micSource = null
        }
        if (state.audioContext) {
          state.audioContext.close().catch(() => {})
          state.audioContext = null
        }
        if (state.stream) {
          state.stream.getTracks().forEach(track => track.stop())
          state.stream = null
        }
      }

      async function startPcmRecorder() {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext
        if (!AudioContextCtor) throw new Error('This browser does not support AudioContext recording.')
        state.stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        })
        const ctx = new AudioContextCtor()
        state.audioContext = ctx
        if (ctx.state === 'suspended') await ctx.resume()
        const source = ctx.createMediaStreamSource(state.stream)
        const processor = ctx.createScriptProcessor(4096, 1, 1)
        processor.onaudioprocess = (event) => {
          if (!state.recording || !state.ws || state.ws.readyState !== WebSocket.OPEN) return
          const input = event.inputBuffer.getChannelData(0)
          const pcm16 = floatToPcm16(downsampleTo16k(input, ctx.sampleRate))
          if (pcm16.byteLength > 0) state.ws.send(pcm16.buffer)
        }
        source.connect(processor)
        processor.connect(ctx.destination)
        state.micSource = source
        state.micProcessor = processor
      }

      async function startRecording() {
        if (!state.connected || state.recording) return
        try {
          state.ws.send(JSON.stringify({
            type: 'audio_start',
            quality: currentQuality(),
            avatar_url: state.avatarUrl,
            format: 'pcm_s16le',
            sample_rate: 16000,
          }))
          state.recording = true
          els.recordButton.textContent = 'Release to Send'
          els.recordButton.classList.add('recording')
          els.voiceWave.classList.add('active')
          await startPcmRecorder()
        } catch (err) {
          state.recording = false
          state.recorderStopping = false
          els.recordButton.textContent = 'Hold to Talk'
          els.recordButton.classList.remove('recording')
          els.voiceWave.classList.remove('active')
          cleanupMicPipeline()
          if (state.ws && state.ws.readyState === WebSocket.OPEN) {
            state.ws.send(JSON.stringify({
              type: 'audio_end',
              avatar_url: state.avatarUrl,
              format: 'pcm_s16le',
              sample_rate: 16000,
            }))
          }
          throw err
        }
      }

      function stopRecording() {
        if (!state.recording || state.recorderStopping) return
        state.recording = false
        state.recorderStopping = true
        els.recordButton.textContent = 'Hold to Talk'
        els.recordButton.classList.remove('recording')
        els.voiceWave.classList.remove('active')
        cleanupMicPipeline()
        state.recorderStopping = false
        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
          state.ws.send(JSON.stringify({
            type: 'audio_end',
            avatar_url: state.avatarUrl,
            format: 'pcm_s16le',
            sample_rate: 16000,
          }))
          setStatus('Recording sent. Waiting for the response.')
        }
      }

      els.connectButton.addEventListener('click', connect)
      els.avatarInput.addEventListener('change', async () => {
        const file = els.avatarInput.files && els.avatarInput.files[0]
        if (!file) return
        try {
          await uploadAvatar(file)
          setStatus('Avatar image loaded.')
        } catch (err) {
          setStatus(err instanceof Error ? err.message : String(err))
        }
      })
      els.chatForm.addEventListener('submit', (event) => {
        event.preventDefault()
        const text = els.textInput.value.trim()
        if (!text || !state.ws || state.ws.readyState !== WebSocket.OPEN) return
        addMessage('user', text)
        els.textInput.value = ''
        state.ws.send(JSON.stringify({ type: 'text', text, avatar_url: state.avatarUrl, quality: currentQuality() }))
      })
      // Invio = manda il messaggio. Shift+Invio = va a capo.
      els.textInput.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.shiftKey || event.isComposing) return
        event.preventDefault()
        els.chatForm.requestSubmit
          ? els.chatForm.requestSubmit()
          : els.chatForm.dispatchEvent(new Event('submit', { cancelable: true }))
      })
      els.clearButton.addEventListener('click', () => {
        els.messages.innerHTML = ''
      })
      els.recordButton.addEventListener('pointerdown', (event) => {
        event.preventDefault()
        if (els.recordButton.setPointerCapture) {
          els.recordButton.setPointerCapture(event.pointerId)
        }
        startRecording().catch(err => setStatus(err instanceof Error ? err.message : String(err)))
      })
      els.recordButton.addEventListener('pointerup', (event) => {
        if (els.recordButton.releasePointerCapture) {
          try {
            els.recordButton.releasePointerCapture(event.pointerId)
          } catch (_) {}
        }
        stopRecording()
      })
      els.recordButton.addEventListener('pointercancel', stopRecording)
      window.addEventListener('pointerup', stopRecording)
      window.addEventListener('pointercancel', stopRecording)

      fetch('/api/config')
        .then(res => res.json())
        .then(data => {
          state.avatarUrl = data.default_avatar_url || state.avatarUrl
          els.avatarImage.src = state.avatarUrl
          state.defaultQuality = data.default_quality || '384p'
          if (Array.isArray(data.qualities)) {
            els.qualitySelect.innerHTML = ''
            for (const item of data.qualities) {
              const option = document.createElement('option')
              option.value = item.id
              option.textContent = item.label
              option.selected = item.id === state.defaultQuality
              els.qualitySelect.appendChild(option)
            }
          }
          const mode = data.lite ? `Lite/${data.steps} step` : `${data.steps} step`
          els.modeValue.textContent = data.backend === 'local' && data.llm_model
            ? `${mode} · ${data.llm_model}`
            : mode
          if (!data.doubao_ready) {
            setStatus(data.backend === 'local'
              ? 'Motore locale non pronto: controlla che LM Studio sia avviato.'
              : 'Credenziali Doubao non trovate. Configura DOUBAO_APP_ID e DOUBAO_ACCESS_TOKEN nel file .env.')
          }
        })
        .catch(() => {})
    </script>
  </body>
</html>
