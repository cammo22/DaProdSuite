appId: it.daprod.suite
productName: DaProd Suite
copyright: DaProdProduzioni

directories:
  output: ../../installer
  buildResources: build

files:
  - out/**
  - package.json
  # @daprod/ipc è un pacchetto del workspace: senza questo, electron-builder
  # segue il symlink di pnpm e non lo impacchetta.
  - "!node_modules/@daprod/ipc"
  - node_modules/@daprod/ipc/dist/**
  - node_modules/@daprod/ipc/package.json

# Manifest, requirements e servizi Python non entrano nell'asar: devono restare
# file veri su disco perché uv e il processo Python li leggano ed eseguano.
extraResources:
  - from: ../../manifest
    to: manifest
  # Senza questo, `paths.ts` cerca base.txt in resources/requirements e non lo
  # trova: dalla versione installata l'ambiente Python non si creerebbe.
  - from: ../../packages/runtime/requirements
    to: requirements
  - from: ../../services
    to: services
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.venv/**"
  # Le interfacce delle app, già compilate da Vite. Fuori dall'asar perché le
  # finestre le caricano con loadFile da un percorso reale.
  - from: ../visualizer/dist
    to: apps/visualizer
  # Musica non passa da Vite: è HTML, CSS e moduli ES senza dipendenze, quindi
  # il sorgente è già la versione da spedire.
  - from: ../musica
    to: apps/musica
  - from: ../foto
    to: apps/foto

win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder converte il PNG in .ico multi-risoluzione da solo.
  icon: build/icon.png
  artifactName: DaProdSuite-Setup-${version}.${ext}

nsis:
  # Un solo clic, per utente: niente UAC, niente scelta della cartella. La suite
  # scrive comunque i suoi dati in %LOCALAPPDATA%, non serve Program Files.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DaProd Suite
  # I modelli scaricati (decine di GB) e i risultati non si toccano mai.
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: cammo22
  repo: DaProdSuite
  releaseType: release
